x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://logmaster:${POSTGRES_PASSWORD}@postgres:5432/logmaster
    REDIS_URL: redis://redis:6379/0
    STORAGE_DIR: /srv/storage
    LM_EAGER: "0"
  volumes: [storage:/srv/storage]
  depends_on: [postgres, redis]
  restart: unless-stopped

services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api]
    restart: unless-stopped
  api:
    <<: *app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  worker:
    <<: *app
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=1
    mem_limit: 768m           # большой архив не вытеснит остальные сервисы
  beat:
    <<: *app
    command: celery -A app.tasks.celery_app beat --loglevel=info   # периодическая очистка хранилища
  bot:
    <<: *app
    command: python -m bot.main
    environment:
      API_URL: http://api:8000
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: logmaster
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: logmaster
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  pgdata:
  storage:
